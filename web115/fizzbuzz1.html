<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Malik Harris's Mighty Hawk — WEB115 — FizzBuzz 1</title>

    <link rel="stylesheet" href="styles/styles.css">
</head>

<body>

    <div data-include="components/header.html"></div>

    <main>
        <h2>FizzBuzz 1</h2>

        <h3 id="greeting">Welcome to Mighty Hawk!</h3>

        <form id="name-form">
            <label for="first_name">First Name:</label>
            <input
                type="text"
                id="first_name"
                placeholder="Enter your first name">

            <br><br>

            <label for="middle_initial">Middle Initial:</label>
            <input
                type="text"
                id="middle_initial"
                placeholder="M"
                maxlength="1">

            <br><br>

            <label for="last_name">Last Name:</label>
            <input
                type="text"
                id="last_name"
                placeholder="Enter your last name">

            <br><br>

            <button type="submit">Submit</button>
        </form>

        <div id="output"></div>
    </main>

    <div data-include="components/footer.html"></div>

    <script>
        // Get the form from the page
        const nameForm = document.getElementById("name-form");

        // Run when the user submits the form
        nameForm.addEventListener("submit", function(event) {

            // Stop the page from refreshing
            event.preventDefault();

            // Get the user's name
            let firstName = document.getElementById("first_name").value.trim();
            let middleInitial = document.getElementById("middle_initial").value.trim();
            let lastName = document.getElementById("last_name").value.trim();

            // Use Guest if no first name was entered
            if (firstName === "") {
                firstName = "Guest";
            }

            // Build the full name
            let fullName = firstName;

            // Add middle initial if entered
            if (middleInitial !== "") {
                fullName += " " + middleInitial + ".";
            }

            // Add last name if entered
            if (lastName !== "") {
                fullName += " " + lastName;
            }

            // Change the greeting
            document.getElementById("greeting").textContent =
                "Welcome to Mighty Hawk, " + fullName + "!";

            // Values used for FizzBuzz
            const maxNumber = 140;
            const firstDivisor = 3;
            const secondDivisor = 5;

            // Mighty Hawk themed words
            const normalWord = "Soar!";
            const firstWord = "Screech!";
            const secondWord = "Dive!";

            // Get the output area
            const output = document.getElementById("output");

            // Clear old results
            output.innerHTML = "";

            // Create a numbered list
            const list = document.createElement("ol");

            // Count from 1 to 140
            for (let i = 1; i <= maxNumber; i++) {

                // Create a list item
                const listItem = document.createElement("li");

                // Check if number is divisible by both 3 and 5
                if (i % firstDivisor === 0 && i % secondDivisor === 0) {
                    listItem.textContent = firstWord + " " + secondWord;
                }

                // Check if number is divisible by 3
                else if (i % firstDivisor === 0) {
                    listItem.textContent = firstWord;
                }

                // Check if number is divisible by 5
                else if (i % secondDivisor === 0) {
                    listItem.textContent = secondWord;
                }

                // All other numbers
                else {
                    listItem.textContent = normalWord;
                }

                // Add item to the numbered list
                list.appendChild(listItem);
            }

            // Show the list
            output.appendChild(list);
        });
    </script>

    <script src="scripts/HTMLInclude.js"></script>
</body>
</html>
