<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>M.H. Web Design Co.</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;

            background-color: #d7d7d7;

            font-family: Arial, Helvetica, sans-serif;
        }

        .business-card {
            position: relative;

            width: 850px;
            height: 485px;

            background-color: #FFFBEA;

            border: 2px solid #555555;

            box-shadow:
                0 15px 35px rgba(0, 0, 0, 0.25);

            overflow: hidden;
        }

        .top-section {
            height: 70%;

            display: flex;
            align-items: center;

            padding: 35px 55px;
        }

        .logo {
            width: 38%;
            text-align: center;
        }

        .logo img {
            width: 220px;
            max-width: 100%;
        }

        .information {
            width: 62%;

            color: #666666;
        }

        .company-name {
            margin: 0 0 35px;

            font-size: 34px;
            font-weight: 400;

            text-align: center;

            white-space: nowrap;
        }

        .contact {
            font-size: 22px;
            line-height: 1.55;
        }

        .contact p {
            margin: 8px 0;
        }

        .bottom-section {
            height: 30%;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            background-color: #77787B;

            color: white;

            text-align: center;
        }

        .name {
            margin: 0;

            font-size: 32px;
            font-weight: 400;
        }

        .title {
            margin: 5px 0 0;

            font-size: 23px;
        }

        @media (max-width: 700px) {

            .business-card {
                width: 95vw;
                height: auto;
                min-height: 450px;
            }

            .top-section {
                padding: 25px;
            }

            .company-name {
                font-size: 25px;
            }

            .contact {
                font-size: 15px;
            }

            .name {
                font-size: 25px;
            }

            .title {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <main class="business-card">

        <section class="top-section">

            <div class="logo">
                <img
                    src="images/logo.png"
                    alt="M.H. Web Design Co. logo"
                >
            </div>

            <div class="information">

                <h1 class="company-name">
                    M.H. Web Design Co.
                </h1>

                <div class="contact">

                    <p>
                        4827 Westfield Park Drive, Suite 215,<br>
                        Charlotte, NC 28209
                    </p>

                    <p>
                        +1 (704) 234-5678
                    </p>

                    <p>
                        <a href="mailto:malik@mhwebdesignco.com">
                        malik@mhwebdesignco.com
                        </a>    
                    </p>

                    <p>
                        <a href="https://www.mhwebdesignco.com">
                        www.mhwebdesignco.com
                        </a>    
                    </p>

                </div>

            </div>

        </section>

        <section class="bottom-section">

            <h2 class="name">
                Malik Harris
            </h2>

            <p class="title">
                Web Designer
            </p>

        </section>

    </main>

</body>
</html>
