        <script>
            // Get the form from the webpage
            const nameForm = document.getElementById("name-form");

            // Run the code when the form is submitted
            nameForm.addEventListener("submit", function(event) {

                // Stop the page from refreshing
                event.preventDefault();

                // Get the user's name
                let firstName = document.getElementById("first_name").value.trim();
                let middleInitial = document.getElementById("middle_initial").value.trim();
                let lastName = document.getElementById("last_name").value.trim();

                // Check if the user entered a first name
                if (firstName === "") {
                    firstName = "Guest";
                }

                // Start building the full name
                let fullName = firstName;

                // Add the middle initial if one was entered
                if (middleInitial !== "") {
                    fullName += " " + middleInitial + ".";
                }

                // Add the last name if one was entered
                if (lastName !== "") {
                    fullName += " " + lastName;
                }

                // Change the greeting
                document.getElementById("greeting").textContent =
                    "Welcome to Mighty Hawk, " + fullName + "!";

                // Ask the user how high they want to count
                let limit = prompt(
                    "How high do you want to count, " + firstName + "?"
                );

                // Change the answer into a number
                limit = Number(limit);

                // Check if the number is valid
                if (isNaN(limit) || limit <= 0) {
                    alert("Invalid number. The program will count to 125 instead.");
                    limit = 125;
                }

                // Get the output area
                const output = document.getElementById("output");

                // Clear previous output
                output.innerHTML = "";

                // Create a list
                const list = document.createElement("ul");

                // Loop from 1 to the number the user entered
                for (let i = 1; i <= limit; i++) {

                    let numberType;

                    // Check if the number is even or odd
                    if (i % 2 === 0) {
                        numberType = "even";
                    } else {
                        numberType = "odd";
                    }

                    // Create a new list item
                    const listItem = document.createElement("li");

                    // Add the Mighty Hawk message
                    listItem.textContent =
                        i + ") Mighty Hawk - the number is " + numberType;

                    // Add the item to the list
                    list.appendChild(listItem);
                }

                // Display the list
                output.appendChild(list);
            });
        </script>

        <script src="https://lint.page/kit/880bd5.js" crossorigin="anonymous"></script>
    </footer>
